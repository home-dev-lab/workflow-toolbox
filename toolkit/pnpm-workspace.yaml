packages:
  - 'packages/*'
  - 'examples'

# pnpm 11 build-script approval (replaces onlyBuiltDependencies): esbuild's
# postinstall compiles/links its platform binary - required.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk@0.3.280'

# pnpm >=11 home for overrides (package.json#pnpm.overrides is no longer read).
# esbuild pin dates from when this workspace hosted the svelte observe app; kept
# conservative for the build package until a newer esbuild is revalidated here.
#
# Targeted Dependabot remediations (mirrors workflow-observatory commit 3c36414):
# - body-parser >=2.0.0 <2.3.0 -> 2.3.0: GHSA-v422-hmwv-36x6 / CVE-2026-12590 (low).
#   DoS when an invalid limit value silently disables body-size enforcement.
#   Transitive via express@5 <- @modelcontextprotocol/sdk <- @anthropic-ai/claude-agent-sdk
#   (a devDependency of @workflow-toolbox/smoke's upgrade-canary tooling only — not
#   part of `pnpm test`, not shipped/runtime-served).
# - brace-expansion >=3.0.0 <5.0.8 -> 5.0.8: GHSA-3jxr-9vmj-r5cp / CVE-2026-13149
#   (high, dev-only). DoS via exponential expansion of consecutive non-expanding {}
#   groups. Transitive via minimatch@10 <- @typescript-eslint (lint tooling).
#   ⚠ FLOOR RAISED 2026-08-05: the previous `<5.0.7 -> 5.0.7` was still SATISFIED while a
#   newer advisory had moved the bar to 5.0.8, so the override stayed green and the install
#   stayed green with nothing able to say otherwise. That is the failure mode of every `>=X`
#   floor — a satisfied floor and a current floor are indistinguishable from inside the repo.
#   The SELECTOR moves with the floor: pinning 5.0.8 under a `<5.0.7` selector would put the
#   pinned version outside the range it exists to rewrite, which reads as a fix and rewrites
#   nothing.
# - brace-expansion <1.1.18 -> 1.1.18: same advisory family.
#   ⚠ ADDED 2026-08-05, correcting a REFUTED premise this file carried. The previous comment
#   said the lower bound "preserves the brace-expansion 1.1.x/2.1.x copies … (outside the
#   advisory range)". That claim was measured WRONG on 2026-07-24 in the sibling private
#   repo — GitHub's advisory covers those branches too — and the correction was applied
#   there and never carried here. Measured on this tree 2026-08-05: it resolves
#   brace-expansion@1.1.15, which the `< 1.1.18` advisory covers, and NOTHING pinned it.
#   So this repo was not merely behind on a floor; it was relying on a premise its own twin
#   had already disproved. Reachability is unchanged (lint tooling, no attacker-reachable
#   input), and the bump is a same-branch patch.
#   ⚠ NOT ADDED: a 2.x override. This tree resolves no 2.x copy — adding a pin for a version
#   that is not present would look like coverage and buy nothing. Re-check if one appears.
# - @types/node -> 24.13.1: @changesets/cli's dependency tree drags in the ancient
#   @types/node@12.20.55, whose node:module typings trip TS2497 ("can only be
#   referenced with ECMAScript imports/exports") on smoke/src/runtimes.ts under a
#   fresh install where pnpm happens to hoist v12 into smoke's resolution. Pinning to
#   the workspace's own 24.x line (what every other consumer already resolves) purges
#   v12 from the tree entirely, so no hoisting outcome can reintroduce the failure.
#   Type-only, dev-time; @changesets/cli itself resolves fine against 24.x.
# ⚠ FLOOR RAISED 2026-08-06 (card #1834610605760185674): brace-expansion's 5.x floor had
#   gone stale the same way as the observatory's — the advisory moved from 5.0.8 to 5.0.9
#   (GHSA-rgw5-rvv9-x895) while the pin stayed satisfied. The selector's range moves with
#   the pin, or a satisfied-but-outdated pin silently stops rewriting anything.
# ⚠ fast-uri and hono ADDED 2026-08-06 — this repo has Dependabot DISABLED (card
#   #1834753073910646308), so neither gap was visible from the GitHub alerts API; both were
#   found only by querying the GHSA advisory database directly (`gh api advisories?...`)
#   and comparing against this tree's resolved versions in pnpm-lock.yaml:
#   - fast-uri resolved 3.1.2, vulnerable to GHSA-7p8r-x3mc-p8w7 (>=3.0.0 <3.1.5, high).
#     No override existed for it at all before this pass.
#   - hono resolved 4.12.25, vulnerable to several advisories up to GHSA-8j4g-w8fx-2239
#     (<4.12.34, medium) — same floor already carried by the observatory's own override.
overrides:
  esbuild: ~0.28.1
  # ⚠ FLOORS AND SELECTORS RAISED 2026-11-08 (GitHub reported 28 open alerts on the 0.198.0 push):
  #   body-parser GHSA-27r3-jxmh-p828 (high) needs 2.4.0; brace-expansion GHSA-q2hr-2g5m-vwhr
  #   (medium) needs 5.0.12 on the 5.x line and 1.1.21 on the 1.x line. Each selector moves with
  #   its floor, so the version resolved before this pass still falls inside the range it rewrites.
  body-parser@>=2.0.0 <2.4.0: '>=2.4.0 <3'
  brace-expansion@>=3.0.0 <5.0.12: 5.0.12
  brace-expansion@<1.1.21: 1.1.21
  # ⚠ FLOOR RAISED 2026-09-15: was '>=4.1.2', SATISFIED by the resolved 4.1.2 while the advisory
  #   had moved to GHSA >= 4.1.3 (high). Exactly the failure this file names twice already — a
  #   satisfied floor and a current floor are indistinguishable from inside the repo.
  # ⚠ RAISED 2026-11-08: 4.1.4 was resolved; GHSA-jvvf-x445-j334, -333x-w4r6-6crp, -wjr9-j795-jxcr,
  #   -xhq7-xmqj-769h and -w74x-v6f9-j3xg (medium/low) need 4.2.3. Now bounded above.
  fast-uri: '>=4.2.3 <5'
  # ⚠ FLOOR RAISED 2026-09-15: was '>=4.12.34', satisfied by the resolved 4.13.0; the advisory
  #   now requires >= 4.13.5 (medium).
  # ⚠ RAISED 2026-11-08: 4.13.7 was resolved; GHSA-5r4p-p66f-jhc7 (medium) needs 4.13.11.
  hono: '>=4.13.11 <5'
  # GHSA-frvp-7c67-39w9 (medium, card #1836392997323801751): path traversal in serve-static
  # on Windows via an encoded backslash (%5C). Pulled in transitively, dev-only, via
  # packages/smoke's devDependency on @anthropic-ai/claude-agent-sdk ->
  # @modelcontextprotocol/sdk -> @hono/node-server@1.19.14. No shipped package (runtime,
  # patterns, build, pipeline-spec, std) depends on it. The SDK's own package.json pins
  # '@hono/node-server': '^1.19.9' (so this override crosses that peer's major line on
  # purpose) — smoke is private, excluded from `pnpm test`, so a breaking change here has
  # no blast radius beyond that one dev-only canary script.
  # ⚠ RAISED 2026-11-08: 2.1.0 was resolved; GHSA-rmxm-3fg6-px4f (medium) needs 2.1.3.
  '@hono/node-server': '>=2.1.3 <3'
  # Surfaced 2026-08-06, in the first minute after Dependabot alerts were enabled on this repo.
  # Manual GHSA polling had missed all three, because you can only query the packages you think of.
  # ⚠ RAISED 2026-11-08: the '>=10.3.1' floor was satisfied by 10.4.0 while GHSA-2vr4-cq9g-pvrc,
  #   -rpw4-54j3-4h4q, -j6r3-76f7-8jcv, -h3mg-xc3c-68pw and -rxp7-6hxx-x8q5 (medium) moved the bar to 10.7.4.
  ip-address: '>=10.7.4 <11'
  postcss: '>=8.5.23' # GHSA high + medium: sourceMappingURL path traversal (the medium is the incomplete fix)
  # ⚠ BOUNDED ON PURPOSE. The advisory range is >=4.0.0 <4.3.0 — the 3.x line is NOT affected, and
  # this tree still resolves js-yaml@3.15.0 for other consumers. An unbounded '>=4.3.0' would drag
  # those onto a major they were never written against, to fix a vulnerability they do not have.
  # ⚠ The UPPER bound is not decoration either: an unbounded '>=4.3.0' resolved to js-yaml@5.2.3
  # on the first install — a whole major past what the advisory asks for, taken silently because
  # the range allowed it. Fix what the advisory names, nothing more.
  # ⚠ FLOOR AND SELECTOR BOTH RAISED 2026-09-15: the pin resolved js-yaml@4.3.1, which the old
  #   `<4.3.0` selector no longer covers — so the override had stopped rewriting anything while
  #   still reading as a fix, and the advisory had meanwhile moved to >= 4.3.2. This is the
  #   selector-must-move-with-the-floor rule stated above, now observed on this very entry.
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2 <5'
  # ⚠ The 3.x line turned out to have an advisory of its OWN — GHSA-5p4m-2wfm-xmqj (high,
  # dev-only scope), surfaced 2026-08-09 on the push that fixed something else entirely.
  # The comment above says "the 3.x line is NOT affected", and that was true OF THAT ADVISORY;
  # it was never a statement about the 3.x line's safety in general. Read it that way — one
  # bounded override per advisory, never one range trying to cover both.
  # Resolved was exactly 3.15.0 against a bar of 3.15.1: a same-patch bump inside 3.x, and the
  # upper bound keeps it from drifting onto 4.x for consumers written against 3.
  # ⚠ SAME, on the 3.x line 2026-09-15: resolved 3.15.1 sits outside the old `<3.15.1` selector,
  #   and the advisory now requires >= 3.15.2.
  js-yaml@>=3.0.0 <3.15.2: '>=3.15.2 <4'
  '@types/node': 24.13.1
  # Added 2026-11-08, one bounded override per advisory family. These sit on the chain
  # @anthropic-ai/claude-agent-sdk -> @modelcontextprotocol/sdk (a peer the SDK auto-installs)
  # -> express/hono, on the vitest/vite/tsup toolchain, or on knip. The SDK chain is not only a
  # dev concern: the plugin loads the agent SDK in-process and its resolver tries this toolkit's
  # install first (plugin/bin/lib/host/sdk-resolution.mjs), so a checkout with installed
  # node_modules runs these copies.
  proxy-addr@<2.0.8: '>=2.0.8 <3' # GHSA-jqcg-44mw-7w3h (critical): IPv4-mapped IPv6 trust bypass
  source-map-js@>=1.0.0 <1.2.2: '>=1.2.2 <2' # GHSA-68fv-2mgg-jv7q (high): event-loop DoS
  # GHSA-6qxp-vccf-f47h, GHSA-22jm-h49p-29qw (high), GHSA-6prh-2h8m-c8cw, GHSA-rvq5-wwqv-78pq,
  # GHSA-46jr-4wx8-v453, GHSA-f897-62hf-6gxq: the agent SDK's peer range ^1.29.0 still holds.
  '@modelcontextprotocol/sdk@<1.32.0': '>=1.32.0 <2'
  # GHSA-587h-7wmj-h5pm (high), GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw, GHSA-rq7h-c2jc-7f22,
  # GHSA-9jrq-w75r-8gcw: stays on the vite 6 line vitest 4.1 was resolved against.
  vite@<=6.4.3: '>=6.4.4 <7'
  smol-toml@<1.9.0: '>=1.9.0 <2' # GHSA-r4xh-jqrq-34v2 (medium): quadratic parse
  qs@>=6.7.0 <6.16.1: '>=6.16.1 <7' # GHSA-6pq8-jhm2-2vcw (medium): stringify comma TypeError
  zod@>=4.0.0 <4.6.6: '>=4.6.6 <5' # GHSA-mrhx-c7xc-m3w5 (high): memory exhaustion on large collections
  nanoid@<3.3.18: '>=3.3.18 <4' # GHSA-2v37-7h3g-55p8 (high): custom generator loops on size zero
  # GHSA-g3hv-75wg-m249 (medium): globparts amplification. The fix exists only on minimatch 11,
  # so this crosses a major for eslint's config-array on purpose; gates decide whether it holds.
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1 <12'
