# Cross-OS validation matrix: the full test
# suite + the wt-observe lifecycle smoke on real Windows/macOS/Linux runners.
#
# Cost discipline (CI minutes are finite; win runners cost x2, mac x10):
# NOT on every push. Triggers: manual dispatch, a weekly cron (default branch
# only, per GitHub semantics), and a push that touches THIS file (so landing or
# editing the workflow self-triggers one validation run). Develop host-layer
# merges are dispatched by plugin/bin/wt-crossos-dispatch.mjs on the public repo.
# Run 1 (2026-07-08) immediately caught a real macOS-only test-fixture bug
# (/var → /private/var symlink vs realpath'd resolveDir) — the matrix earns its keep.
# ci-trigger: win-fixes iteration 1
name: cross-os
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC (off-minute by design)
  push:
    branches: [main]
    tags: ['workflow-toolbox--v*']
    paths:
      - '.github/workflows/cross-os.yml'

# Each card/ci-* branch is its own group; on main GitHub keeps one running
# and one pending run per group, replacing an older PENDING run with a newer one.
concurrency:
  group: cross-os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    strategy:
      fail-fast: false
      # Windows is two PARALLEL jobs (shard 1 and shard 2): the full Windows suite measured 1217-1724 s in
      # one step over eight runs, which left the 35-minute job with no margin. A job without `shard` has an
      # empty `matrix.shard`, so the shard conditions below treat ubuntu and macOS as unsharded.
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            shard: 1
          - os: windows-latest
            shard: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: toolkit
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 24
      - name: Enable corepack (pnpm pinned via packageManager)
        run: corepack enable
        timeout-minutes: 5
      - name: Install
        run: pnpm install
        timeout-minutes: 6
      # The default reporter ignores --outputFile (vitest writes a file only for json/junit/html), so the
      # streaming log is captured with tee; an explicit `shell: bash` runs `bash -eo pipefail` (the unspecified default is `bash -e`, whose pipeline exit is tee's), pwsh re-raises $LASTEXITCODE.
      - name: Test (POSIX)
        shell: bash
        if: ${{ runner.os == 'Linux' }}
        run: |
          mkdir -p ci-diagnostics
          pnpm test 2>&1 | tee ci-diagnostics/vitest.log
        timeout-minutes: 22
      # The macOS probe runs the suite in two halves so that one half's log survives a frozen runner.
      # Coverage is off here on purpose: thresholds judged on half a suite would be red by construction.
      # Coverage thresholds are judged on ubuntu only: the Windows shards run coverage WITHOUT thresholds
      # (toolkit/vitest.config.mts leaves them undefined on win32), macOS runs no coverage.
      # `test:shard` does not build; `pnpm test` did (through script-gates.mjs), so every sharded job
      # (macOS and both Windows shards) builds here. Measured on Windows: ~17 s (build:dist + cross-repo-typecheck).
      - name: Build for the sharded suites
        if: ${{ runner.os != 'Linux' }}
        run: pnpm build:dist && node scripts/cross-repo-typecheck.mjs
        timeout-minutes: 8
      - name: Test (macOS shard 1/2)
        shell: bash
        id: mac_shard_1
        if: ${{ runner.os == 'macOS' }}
        continue-on-error: true
        env:
          WT_VITEST_MAX_WORKERS: 2
        run: |
          mkdir -p ci-diagnostics
          pnpm test:shard --shard=1/2 2>&1 | tee ci-diagnostics/vitest-shard-1-of-2.log
        timeout-minutes: 12
      - name: Test (macOS shard 2/2)
        shell: bash
        id: mac_shard_2
        if: ${{ runner.os == 'macOS' }}
        continue-on-error: true
        env:
          WT_VITEST_MAX_WORKERS: 2
        run: |
          mkdir -p ci-diagnostics
          pnpm test:shard --shard=2/2 2>&1 | tee ci-diagnostics/vitest-shard-2-of-2.log
        timeout-minutes: 12
      # The shards are continue-on-error so BOTH always run and both logs reach the artifact; this step is what
      # makes the JOB red when either failed. Measured 2026-09-17: two lifecycle cases were red on every macOS
      # shard from run 28 to run 34 while the job reported success, because nothing read the shard outcomes.
      - name: macOS shard results
        if: ${{ runner.os == 'macOS' }}
        run: |
          echo "shard 1/2: ${{ steps.mac_shard_1.outcome }} · shard 2/2: ${{ steps.mac_shard_2.outcome }}"
          test "${{ steps.mac_shard_1.outcome }}" = "success" && test "${{ steps.mac_shard_2.outcome }}" = "success"
        timeout-minutes: 1
      # Windows measured 2026-09, eight runs: the full suite step took 1217-1724 s (coverage and build included);
      # the two macOS shards split the same suite 61-66 % / 34-39 % by time, so the worst Windows shard is
      # about 0.66 x 1724 s = 19 min, and 28 minutes is ~1.5x that. The shards run coverage without thresholds
      # so the custom coverage provider's merge and cleanup path stays exercised on Windows. Shard 1 (the heavy
      # half) carries nothing else; shard 2 carries the diagnostic step and the typecheck, quality, lint and smoke steps.
      - name: Test (Windows shard ${{ matrix.shard }}/2)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          # windows-latest has 4 vCPUs; two workers avoid oversubscribing process-heavy fixtures.
          WT_VITEST_MAX_WORKERS: 2
        run: |
          New-Item -ItemType Directory -Force ci-diagnostics | Out-Null
          pnpm test:shard --shard=${{ matrix.shard }}/2 --coverage 2>&1 | Tee-Object ci-diagnostics/vitest-shard-${{ matrix.shard }}-of-2.log
          exit $LASTEXITCODE
        timeout-minutes: 28
      # Dispatcher step contract: names beginning "Diagnose " are diagnostic and never gate the job;
      # every other step, including the continue-on-error macOS shards, is gating. Keep diagnostic
      # step names under that prefix so job logs can distinguish them from blocking failures.
      # Diagnostic, never a gate: the vitest fork carrying artifact-server.test.ts has died on the hosted
      # Windows runner without a result line since run 27 (`Worker exited unexpectedly` names no file).
      # Run that one file alone, one worker, verbose reporter, with Node tracing every exit and uncaught
      # exception, so the artifact carries the fork's last words instead of the pool's silence.
      - name: Diagnose artifact-server fork (Windows)
        if: ${{ always() && runner.os == 'Windows' && matrix.shard == 2 }}
        continue-on-error: true
        shell: pwsh
        env:
          WT_VITEST_MAX_WORKERS: 1
          NODE_OPTIONS: --trace-exit --trace-uncaught --trace-warnings
        run: |
          New-Item -ItemType Directory -Force ci-diagnostics | Out-Null
          pnpm test:shard packages/build/test/artifact-server.test.ts --reporter=verbose 2>&1 | Tee-Object ci-diagnostics/artifact-server-fork.log
          exit $LASTEXITCODE
        timeout-minutes: 8
      - name: Typecheck
        if: ${{ matrix.shard != 1 }}
        run: pnpm typecheck
        timeout-minutes: 5
      - name: Quality
        if: ${{ matrix.shard != 1 }}
        run: pnpm quality
        timeout-minutes: 5
      - name: Lint
        if: ${{ matrix.shard != 1 }}
        run: pnpm lint
        timeout-minutes: 5
      - name: wt-observe lifecycle smoke (native state root, PID identity, portable spawn)
        if: ${{ matrix.shard != 1 }}
        run: node scripts/ci-lifecycle-smoke.mjs
        timeout-minutes: 5
      - name: Runner process table (POSIX)
        if: ${{ always() && runner.os != 'Windows' }}
        run: |
          mkdir -p ci-diagnostics
          ps -eo pid=,ppid=,pgid=,state=,etime=,args= | tee ci-diagnostics/process-table.txt
        timeout-minutes: 5
      - name: Runner process table (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-diagnostics | Out-Null
          Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,CreationDate,CommandLine | Format-Table -Wrap | Tee-Object ci-diagnostics/process-table.txt
        timeout-minutes: 5
      - name: Upload cross-OS diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-diagnostics-${{ matrix.os }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: toolkit/ci-diagnostics/
          if-no-files-found: warn
        timeout-minutes: 5
