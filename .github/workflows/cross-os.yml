# Cross-OS validation matrix: the full test
# suite + the wt-observe lifecycle smoke on real Windows/macOS/Linux runners.
#
# Cost discipline (CI minutes are finite; win runners cost x2, mac x10):
# NOT on every push. Triggers: manual dispatch, a weekly cron (default branch
# only, per GitHub semantics), and a push that touches THIS file (so landing or
# editing the workflow self-triggers one validation run). Develop host-layer
# merges are dispatched by plugin/bin/wt-crossos-dispatch.mjs on the public repo.
# Run 1 (2026-07-08) immediately caught a real macOS-only test-fixture bug
# (/var → /private/var symlink vs realpath'd resolveDir) — the matrix earns its keep.
# ci-trigger: host adapter real contract, 2026-09-21
name: cross-os
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC (off-minute by design)
  push:
    branches: [main]
    tags: ['workflow-toolbox--v*']
    paths:
      - '.github/workflows/cross-os.yml'

# Each card/ci-* branch is its own group; on main GitHub keeps one running
# and one pending run per group, replacing an older PENDING run with a newer one.
concurrency:
  group: cross-os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    strategy:
      fail-fast: false
      # Windows is three PARALLEL jobs (shards 1, 2 and 3): the full Windows suite measured 1217-1724 s in
      # one step over eight runs, which left the 35-minute job with no margin, and two shards stopped being
      # enough as the suite grew (see the sharding history above the Windows test step). A job without
      # `shard` has an empty `matrix.shard`, so the shard conditions below treat ubuntu and macOS as unsharded.
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            shard: 1
            timeout: 75
          - os: windows-latest
            shard: 2
            timeout: 75
          - os: windows-latest
            shard: 3
            timeout: 75
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 45 }}
    defaults:
      run:
        working-directory: toolkit
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          # The current tree and its first parent are sufficient for owner certification.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 24
      # Suite-lock interop clients can be outside this ref's ancestry.
      # Fetch every descriptor commit explicitly alongside first-parent comparison history.
      - name: Fetch the base-version lock client
        shell: bash
        run: |
          commits=$(node -p "Object.values(require('./test-support/base-version-client.json').clients).join('\n')")
          for commit in $commits; do
            git fetch --no-tags --depth=1 origin "$commit"
          done
        timeout-minutes: 3
      - name: Enable corepack (pnpm pinned via packageManager)
        run: corepack enable
        timeout-minutes: 5
      - name: Install
        run: pnpm install
        timeout-minutes: 6
      # The default reporter ignores --outputFile (vitest writes a file only for json/junit/html), so the
      # streaming log is captured with tee; an explicit `shell: bash` runs `bash -eo pipefail` (the unspecified default is `bash -e`, whose pipeline exit is tee's), pwsh re-raises $LASTEXITCODE.
      - name: Test (POSIX)
        shell: bash
        if: ${{ runner.os == 'Linux' }}
        run: |
          mkdir -p ci-diagnostics
          pnpm test 2>&1 | tee ci-diagnostics/vitest.log
        timeout-minutes: 30
      # The macOS probe runs the suite in two halves so that one half's log survives a frozen runner.
      # Coverage is off here on purpose: thresholds judged on half a suite would be red by construction.
      # Coverage thresholds are judged on ubuntu only: the Windows shards run coverage WITHOUT thresholds
      # (toolkit/vitest.config.mts leaves them undefined on win32), macOS runs no coverage.
      # `test:shard` does not build; `pnpm test` did (through script-gates.mjs), so every sharded job
      # (macOS and every Windows shard) builds here. Measured on Windows: ~17 s (build:dist + cross-repo-typecheck).
      - name: Build for the sharded suites
        if: ${{ runner.os != 'Linux' }}
        run: pnpm build:dist && node scripts/cross-repo-typecheck.mjs
        timeout-minutes: 8
      # Replay checks the parsers; this contract also checks native invocation and process lifetime.
      # The suite steps below carry `!cancelled()`: a red contract still fails the job, but no longer skips the suite
      # and hides every other failure of that entry.
      - name: Host adapter contract against the REAL platform
        if: ${{ matrix.shard != 2 && matrix.shard != 3 }}
        shell: bash
        env:
          WT_HOST_CONTRACT_REAL: '1'
        run: |
          mkdir -p ci-diagnostics
          pnpm test:shard packages/build/test/host-adapter.contract.test.ts 2>&1 \
            | tee "ci-diagnostics/host-contract-${{ runner.os }}.log"
        timeout-minutes: 8
      - name: Test (macOS shard 1/2)
        shell: bash
        id: mac_shard_1
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        env:
          WT_VITEST_MAX_WORKERS: 2
        run: |
          mkdir -p ci-diagnostics
          pnpm test:shard --shard=1/2 2>&1 | tee ci-diagnostics/vitest-shard-1-of-2.log
        timeout-minutes: 15
      - name: Test (macOS shard 2/2)
        shell: bash
        id: mac_shard_2
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        env:
          WT_VITEST_MAX_WORKERS: 2
        run: |
          mkdir -p ci-diagnostics
          pnpm test:shard --shard=2/2 2>&1 | tee ci-diagnostics/vitest-shard-2-of-2.log
        timeout-minutes: 15
      # The shards are continue-on-error so BOTH always run and both logs reach the artifact; this step is what
      # makes the JOB red when either failed. Measured 2026-09-17: two lifecycle cases were red on every macOS
      # shard from run 28 to run 34 while the job reported success, because nothing read the shard outcomes.
      - name: macOS shard results
        if: ${{ runner.os == 'macOS' }}
        run: |
          echo "shard 1/2: ${{ steps.mac_shard_1.outcome }} · shard 2/2: ${{ steps.mac_shard_2.outcome }}"
          test "${{ steps.mac_shard_1.outcome }}" = "success" && test "${{ steps.mac_shard_2.outcome }}" = "success"
        timeout-minutes: 1
      # Windows measured before sharding (eight runs, 2026-09): the full suite step took 1217-1724 s (coverage and
      # build included). First sharded run (cross-os run 36811210122): shard 1 test step 885 s (job 935 s), shard 2
      # test step 642 s (job 978 s). By 2026-10-12 shard 2 took 17m07s-17m38s and on 2026-10-13 (run 38398256468) it
      # was killed at its 20-minute budget while still progressing, so both shards got 28 min. On 2026-10-19 shard 2
      # was killed again at 28 minutes with about 210 of roughly 250 test files done (shard 1 took 16 minutes), so
      # Windows is now THREE shards. Vitest orders files by a hash of their path and cuts that order into contiguous
      # slices, so shard 3/3 holds only files from the old second half (the one killed at 28 minutes: the two
      # sdk-pilot-lifecycle suites near 500 s each, pilot-runner, quality-changed, wt-lane-integrate), while shard 1/3
      # holds only files from the old first half (16 minutes). Shard 1 is therefore the lightest slice by measurement,
      # and it alone carries the non-suite steps: host adapter contract (8 min cap), typecheck, quality, lint and the
      # lifecycle smoke (5 min cap each), and the Diagnose step (8 min cap, `always()`). Worst case on shard 1, every
      # step at its cap: setup 3 + build 8 + contract 8 + suite 28 + Diagnose 8 + 4 x 5 = 75 minutes, so the job
      # timeout is 75 for the Windows entries only (`timeout: 75` in the matrix); ubuntu and macOS keep 45. A hung suite still
      # leaves room for the process table and the artifact upload. Shards 2 and 3 carry only setup, build and the
      # suite: 3 + 8 + 28 = 39. The shards run coverage without thresholds so the custom coverage provider's merge and
      # cleanup path stays exercised on Windows.
      - name: Test (Windows shard ${{ matrix.shard }}/3)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          # windows-latest has 4 vCPUs; two workers avoid oversubscribing process-heavy fixtures.
          WT_VITEST_MAX_WORKERS: 2
        run: |
          New-Item -ItemType Directory -Force ci-diagnostics | Out-Null
          pnpm test:shard --shard=${{ matrix.shard }}/3 --coverage 2>&1 | Tee-Object ci-diagnostics/vitest-shard-${{ matrix.shard }}-of-3.log
          exit $LASTEXITCODE
        timeout-minutes: 28
      # Dispatcher step contract: names beginning "Diagnose " are diagnostic and never gate the job;
      # every other step, including the continue-on-error macOS shards, is gating. Keep diagnostic
      # step names under that prefix so job logs can distinguish them from blocking failures.
      # Diagnostic, never a gate: the vitest fork carrying artifact-server.test.ts has died on the hosted
      # Windows runner without a result line since run 27 (`Worker exited unexpectedly` names no file).
      # Run that one file alone, one worker, verbose reporter, with Node tracing every exit and uncaught
      # exception, so the artifact carries the fork's last words instead of the pool's silence.
      - name: Diagnose artifact-server fork (Windows)
        if: ${{ always() && runner.os == 'Windows' && matrix.shard == 1 }}
        continue-on-error: true
        shell: pwsh
        env:
          WT_VITEST_MAX_WORKERS: 1
          NODE_OPTIONS: --trace-exit --trace-uncaught --trace-warnings
        run: |
          New-Item -ItemType Directory -Force ci-diagnostics | Out-Null
          pnpm test:shard packages/build/test/artifact-server.test.ts --reporter=verbose 2>&1 | Tee-Object ci-diagnostics/artifact-server-fork.log
          exit $LASTEXITCODE
        timeout-minutes: 8
      - name: Typecheck
        if: ${{ matrix.shard != 2 && matrix.shard != 3 }}
        run: pnpm typecheck
        timeout-minutes: 5
      - name: Quality
        if: ${{ matrix.shard != 2 && matrix.shard != 3 }}
        env:
          # Judge this revision against its first parent, including dispatched merge refs.
          WT_QUALITY_BASE: HEAD^1
        run: pnpm quality
        timeout-minutes: 5
      - name: Lint
        if: ${{ matrix.shard != 2 && matrix.shard != 3 }}
        run: pnpm lint
        timeout-minutes: 5
      - name: wt-observe lifecycle smoke (native state root, PID identity, portable spawn)
        if: ${{ matrix.shard != 2 && matrix.shard != 3 }}
        run: node scripts/ci-lifecycle-smoke.mjs
        timeout-minutes: 5
      - name: Runner process table (POSIX)
        if: ${{ always() && runner.os != 'Windows' }}
        run: |
          mkdir -p ci-diagnostics
          ps -eo pid=,ppid=,pgid=,state=,etime=,args= | tee ci-diagnostics/process-table.txt
        timeout-minutes: 5
      - name: Runner process table (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-diagnostics | Out-Null
          Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,CreationDate,CommandLine | Format-Table -Wrap | Tee-Object ci-diagnostics/process-table.txt
        timeout-minutes: 5
      - name: Upload cross-OS diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-diagnostics-${{ matrix.os }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: toolkit/ci-diagnostics/
          if-no-files-found: warn
        timeout-minutes: 5
